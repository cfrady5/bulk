<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1240" viewBox="0 0 1240 1240">
  <defs>
    
  <linearGradient id="mCardGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8E73F5"/>
    <stop offset="0.42" stop-color="#5C5DF0"/>
    <stop offset="1" stop-color="#1E47E6"/>
  </linearGradient>
